name: cmake_build

on: push

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  aria2-container-image:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/marrinosnis/aria2:latest
    
    steps:
      - name: Checkout aria2 project
        uses: actions/checkout@v7
      
      - name: Configure project with CMake build tool
        uses: threeal/cmake-action@v2.1.0
        with: 
          source-dir: ${{ github.workspace }}
          build-dir: ${{ github.workspace }}/../build/
          options: |
            openssl=true
            bittorrent=true
            libaria2=true
            buildTests=false
            websocket=true
            BUILD_SHARED_LIBS=true

      - name: Build the man page and the html docs
        run: |
          cd $GITHUB_WORKSPACE/../build/
          make -j man
          make -j html

      - name: Workaround gh issue actions/upload-artifact#176
        run: |
          echo "artifacts_build_path=$(realpath $GITHUB_WORKSPACE/../build)" >> $GITHUB_ENV

      - name: Upload artifacts with the build's src content
        uses: actions/upload-artifact@v7
        with:
          name: aria2-build-artifact-src
          path: ${{ env.artifacts_build_path }}/src/*

      - name: Upload artifacts with the build's content
        uses: actions/upload-artifact@v7
        with:
          name: aria2-build-artifact-build
          path: ${{ env.artifacts_build_path }}/*