name: cmake_build

on: push

jobs:
  build-project:
    name: Build Aria2

    strategy:
      matrix:
        os: [ubuntu-22.04, macos-14]
        compiler: [gcc, clang]
        crypto: [openssl, gnutls]
        bittorrent: [enable-bt, disable-bt]
        exlclude:
          - os: macos-14
            crypto: gnutls
          - crypto: openssl
            bittorrent: disable-bt
    
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout project
        uses: actions/checkout@v7

      - name: Linux setup - Install necessary libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install \
            g++-12 \
            g++-12 \
            clang-15 \
            cmake \
            libtool \
            pkg-config \
            libssl-dev \
            libgnutls28-dev \
            libc-ares-dev \
            zlib1g-dev \
            libsqlite3-dev \
            libssh2-1-dev \
            libcppunit-dev

      - name: MacOS setup - Install necessary libraries
        if: runner.os == 'macOS'
        run: |
          brew install cppunit gettext openssl libssh2 c-ares sqlite3 \
          pkg-config libtool
      
      # - name: Setup clang (Linux)
      #   if: runner.os == 'Linux' && matrix.compiler == 'clang'
      #   run: |
      
      - name: Show working directory
        if: always()
        run: |
          echo "Show the value of the ${{ github.workspace }}"
          echo "${{ github.workspace }}"

      - name: Build Project
        uses: threeal/cmake-action@v2.1.0
        with: 
          source-dir: ${{ github.workspace }}/aria2
          build-dir: ${{ github.workspace }}/build

