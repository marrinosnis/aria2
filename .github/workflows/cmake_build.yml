name: aria2 workflow

on:
  workflow_dispatch:
    inputs:
      cmake_options:
        description: 'Enter the cmake options with the -Dvar=value structure'
        required: true
        type: string
        default: '-Dopenssl=true -Dbittorrent=true -Dlibaria2=true -Dwebsocket=true -DBUILD_SHARED_LIBS=on'

      build_tests:
        description: 'Set to true to enable the build tests job'
        required: true
        type: boolean
        default: false

      build_docs:
        description: 'Set to true to build the docs for the aria2'
        required: false
        type: boolean
        default: false
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/marrinosnis/aria2-ubuntu-docker-image-build:v1.0
    
    steps:
      - name: Checkout aria2 project
        uses: actions/checkout@v7
      
      - name: Configure project with CMake build tool
        uses: threeal/cmake-action@v2.1.0
        with: 
          source-dir: ${{ github.workspace }}
          build-dir: ${{ github.workspace }}/../build/
          options: |
            openssl=true
            bittorrent=true
            libaria2=true
            buildTests=false
            websocket=true
            BUILD_SHARED_LIBS=true

      - name: Workaround gh issue actions/upload-artifact#176
        run: |
          echo "artifacts_build_path=${{ github.workspace }}/../build/" >> "$GITHUB_ENV"

      - name: Value of env.artifacts_build_path
        run: |
          echo ${{ env.artifacts_build_path }}
          cd ${{ env.artifacts_build_path }}
          ls -la

      - name: Upload artifacts with the build's src content
        uses: actions/upload-artifact@v7
        with:
          name: aria2-build-artifact
          path: ${{ env.artifacts_build_path }}

      # To build docs, activate the following step

      # - name: Build the man page and the html docs
      #   run: |
      #     cd $GITHUB_WORKSPACE/../build/
      #     make -j man
      #     make -j html
  
  build_docs:
    needs: build
    if: ${{ inputs.build_docs }}
    uses: ./.github/workflows/build_docs.yml
    
  build_tests:
    needs: build
    if: ${{ inputs.build_tests }}
    uses: ./.github/workflows/build_tests.yml
    with:
      path: main/path/for/tests