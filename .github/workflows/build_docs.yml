name: Build Docs

on:
  workflow_call:

jobs:
  build_docs:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/marrinosnis/aria2-ubuntu-docker-image-build:v1.0

    steps:
    - name: Checkout project (again)
      uses: actions/checkout@v7

    - name: Setting build directory to github environment variable (workaround gh issue actions/upload-artifact#176)
      run: |
        echo "artifacts_build_path=$(realpath $GITHUB_WORKSPACE/../build)" >> $GITHUB_ENV

    - name: Download artifact from the previous build
      uses: actions/download-artifact@v8
      with:
        name: aria2-build-artifact
        path: ${{ env.artifacts_build_path }}

    - name: Build docs
      working-directory: ${{ env.artifacts_build_path }}
      run: |
        echo "Current directory: $(pwd)"
        make -j man
        make -j html

    - name: Upload artifacts under doc/ directory
      uses: actions/upload-artifact@v7
      with:
        name: aria2-build-docs-artifact
        path: ${{ env.artifacts_build_path }}/doc/manual-src/en/_build/