name: Build Docs

on:
  workflow_call:

jobs:
  build_docs:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/marrinosnis/aria2-ubuntu-docker-image-build:v1.0


    steps:
    - name: Checkout project (again)
      uses: actions/checkout@v7

    - name: Download artifact from the previous build
      uses: actions/download-artifact@v8
      with:
        name: aria2-build-artifact

        # cd $GITHUB_WORKSPACE/../build/
    - name: Build docs from here
      run: |
        echo "Current directory: $(pwd)"
        echo "GithubWorkspace $GITHUB_WORKSPACE value"
        ls -la .
        ls -la .
        make -j man
        make -j html

    - name: Upload artifacts
      uses: actions/upload-artifact@v7
      with:
        name: aria2-build-docs
        path: $GITHUB_WORKSPACE/doc/manual-src/en/_build/

# $GITHUB_WORKSPACE/../build/doc/manual-src/en/_build/