name: Build Docs

on:
  workflow_call:

jobs:
  build_docs:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/marrinosnis/aria2-ubuntu-docker-image-build:v1.0


    steps:
    - name: Checkout project (again)
      uses: actions/checkout@v7

    - name: Download artifact from the previous build
      uses: actions/download-artifact@v8
      with:
        name: aria2-build-artifact
        path: ${{ github.workspace }}/../build/

    - name: Build docs from here
      run: |
        echo "Current directory: $(pwd)"
        ls -la .
        cd ${{ github.workspace }}/../build/
        ls -la .
        make -j man
        make -j html

    - name: Upload artifacts
      uses: actions/upload-artifact@v7
      with:
        name: aria2-build-docs
        path: docs
